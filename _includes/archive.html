
<h2>Archive</h2>

{% assign sorted_tags = site.tags | sort %}

{% for tag in sorted_tags %}
  {% assign tagname = tag[0] %}
  {% assign posts = tag[1] %}

  <h3>
    <a href="{{ '/tag/' | append: tagname | relative_url }}">
      {{ tagname }}
    </a>
    ({{ posts.size }})
  </h3>

  <ul>
    {% for post in posts %}
      <li>
        <a href="{{ post.url | relative_url }}">
          {{ post.title }}
        </a>
        ({{ post.date | date: "%B %d, %Y" }})
      </li>
    {% endfor %}
  </ul>

{% endfor %}
