<h2>Archive — Tag Diagnostics</h2>

<!--
Diagnostic version generated by ChatGPT 261108
Jason miller
-->

{% assign sorted_tags = site.tags | sort %}

<ul>
{% for tag in sorted_tags %}
  <li>
    <strong>{{ tag[0] }}</strong>
    ({{ tag[1].size }} posts)
    <ul>
      {% for post in tag[1] %}
        <li>{{ post.title }}</li>
      {% endfor %}
    </ul>
  </li>
{% endfor %}
</ul>
